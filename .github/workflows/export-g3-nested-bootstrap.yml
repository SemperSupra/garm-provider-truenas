name: Export GARM provider nested G3 bootstrap

on:
  workflow_call:
    inputs:
      provider_ref:
        description: Exact SemperSupra/garm-provider-truenas commit to export
        required: true
        type: string
  workflow_dispatch:
    inputs:
      provider_ref:
        description: Exact provider producer commit; blank uses this workflow commit
        required: false
        type: string
  push:
    branches:
      - prep/g3-nested-bootstrap-v1
    paths:
      - ".github/workflows/export-g3-nested-bootstrap.yml"
      - "cmd/garm-provider-truenas/g3_bootstrap_export_test.go"
      - "cmd/garm-provider-truenas/garm_provider.go"
      - "cmd/garm-provider-truenas/runner_tool.go"
      - "internal/provider/provider.go"

permissions:
  contents: read

concurrency:
  group: garm-provider-g3-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Resolve exact producer source
        id: source
        shell: bash
        env:
          REQUESTED_REF: ${{ inputs.provider_ref }}
        run: |
          set -euo pipefail
          ref="${REQUESTED_REF:-}"
          if [[ -z "$ref" ]]; then
            ref="$GITHUB_SHA"
          fi
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]]
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout exact provider producer
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: SemperSupra/garm-provider-truenas
          ref: ${{ steps.source.outputs.ref }}
          persist-credentials: false

      - name: Verify ordinary provider tests
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${{ steps.source.outputs.ref }}" ]]
          go test ./cmd/garm-provider-truenas ./internal/provider

      - name: Export exact G3 bootstrap bundle
        shell: bash
        env:
          G3_BOOTSTRAP_OUT: /tmp/g3/garm-provider-g3-bootstrap.json
          G3_PRODUCER_SOURCE: ${{ steps.source.outputs.ref }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/g3
          go test ./cmd/garm-provider-truenas -run '^TestExportNestedG3BootstrapFixture$' -count=1 -v
          test -s "$G3_BOOTSTRAP_OUT"

          jq -e --arg source "${{ steps.source.outputs.ref }}" '
            .schema == "semper-supra.garm-provider-truenas-g3-bootstrap/1" and
            .provider_product_source == "14535745dc3aa3c0b5466da7c704bca4d23dcec5" and
            .producer_source == $source and
            .controller_id == "g3-controller" and
            .pool_id == "g3-pool" and
            .bootstrap.os_type == "linux" and
            .bootstrap.arch == "amd64" and
            .bootstrap.flavor == "truenas-linux-general" and
            .bootstrap.jit_config_enabled == true and
            .bootstrap["callback-url"] == "https://127.0.0.1:1/callbacks" and
            .bootstrap["metadata-url"] == "https://127.0.0.1:1/metadata"
          ' "$G3_BOOTSTRAP_OUT" >/dev/null

          ! grep -R -q --             'BEGIN PRIVATE KEY\|ghp_\|github_pat_\|sk-'             /tmp/g3

      - name: Upload exact G3 bootstrap bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: garm-provider-truenas-g3-bootstrap
          path: /tmp/g3/garm-provider-g3-bootstrap.json
          if-no-files-found: error
          retention-days: 7

      - name: Record export evidence
        if: always()
        shell: bash
        run: |
          {
            echo "### GARM provider nested G3 bootstrap export"
            echo
            echo "- producer source: \`${{ steps.source.outputs.ref }}\`"
            if [[ -f /tmp/g3/garm-provider-g3-bootstrap.json ]]; then
              echo "- product source: \`$(jq -r '.provider_product_source' /tmp/g3/garm-provider-g3-bootstrap.json)\`"
              echo "- callback fixture: \`$(jq -r '.bootstrap["callback-url"]' /tmp/g3/garm-provider-g3-bootstrap.json)\`"
              echo "- JIT enabled: \`$(jq -r '.bootstrap.jit_config_enabled' /tmp/g3/garm-provider-g3-bootstrap.json)\`"
            else
              echo "- bundle: not produced"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
