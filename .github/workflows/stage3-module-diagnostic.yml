name: Stage 3 module diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - go.mod
      - go.sum
      - .github/workflows/stage3-module-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false
      - name: Compare regenerated module lock
        shell: bash
        run: |
          set -euo pipefail
          cp go.sum committed.go.sum
          rm -f go.sum
          go mod tidy
          printf '%s\n' '--- SHA256 ---'
          sha256sum committed.go.sum go.sum go.mod
          printf '%s\n' '--- UNIFIED DIFF ---'
          diff -u committed.go.sum go.sum || true
          printf '%s\n' '--- BYTE DIFF ---'
          cmp -l committed.go.sum go.sum || true
          printf '%s\n' '--- REGENERATED GO.SUM BASE64 ---'
          base64 -w0 go.sum
          printf '\n%s\n' '--- END ---'
