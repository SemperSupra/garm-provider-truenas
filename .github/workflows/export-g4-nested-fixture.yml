name: Export GARM provider nested G4 fixture

on:
  workflow_call:
    inputs:
      provider_ref:
        description: Exact SemperSupra/garm-provider-truenas commit to export
        required: true
        type: string
  workflow_dispatch:
    inputs:
      provider_ref:
        description: Exact provider commit; blank uses this workflow commit
        required: false
        type: string
  push:
    branches:
      - prep/g4-capacity-two-fixture-20261002
    paths:
      - ".github/workflows/export-g4-nested-fixture.yml"
      - "internal/truenasstore/g4_fixture_export_test.go"
      - "internal/truenasstore/store.go"
      - "internal/provider/provider.go"

permissions:
  contents: read

concurrency:
  group: garm-provider-g4-fixture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Resolve exact provider source
        id: source
        shell: bash
        env:
          REQUESTED_REF: ${{ inputs.provider_ref }}
        run: |
          set -euo pipefail
          ref="${REQUESTED_REF:-}"
          if [[ -z "$ref" ]]; then
            ref="$GITHUB_SHA"
          fi
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]]
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout exact provider source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: SemperSupra/garm-provider-truenas
          ref: ${{ steps.source.outputs.ref }}
          persist-credentials: false

      - name: Verify source and provider contract tests
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${{ steps.source.outputs.ref }}" ]]
          test -z "$(gofmt -l .)"
          go test ./cmd/garm-provider-truenas ./internal/truenasstore ./internal/provider

      - name: Export exact G4 capacity-two fixture bundle
        shell: bash
        env:
          G4_FIXTURE_OUT: /tmp/g4/garm-provider-g4-fixture.json
          G4_PRODUCER_SOURCE: ${{ steps.source.outputs.ref }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/g4
          go test ./internal/truenasstore -run '^(TestG4SourceConcurrencyReconnectAndRetirementOrders|TestExportNestedG4CapacityTwoFixtureBundle)$' -count=1 -v
          test -s "$G4_FIXTURE_OUT"

          jq -e --arg source "${{ steps.source.outputs.ref }}" '
            .schema == "semper-supra.garm-provider-truenas-g4-capacity-two-fixture/1" and
            .provider_product_source == "14535745dc3aa3c0b5466da7c704bca4d23dcec5" and
            .producer_source == $source and
            .controller_id == "g4-controller" and
            .pool_id == "g4-pool" and
            (.runners | length == 2) and
            (.runners[0].slot == "alpha") and
            (.runners[1].slot == "beta") and
            (.runners[0].expected_app_name != .runners[1].expected_app_name) and
            (.runners[0].expected_app_name | startswith("garm-") and length <= 40) and
            (.runners[1].expected_app_name | startswith("garm-") and length <= 40) and
            .runner.cpu == 4 and
            .runner.memory_bytes == 8589934592 and
            .runner.count == 2 and
            .source_oracles.two_distinct_provider_owned_names == true and
            .source_oracles.fresh_manager_adopts_exact_pair == true and
            .source_oracles.active_delete_refused == true and
            .source_oracles.retirement_alpha_then_beta == true and
            .source_oracles.retirement_beta_then_alpha == true and
            .source_oracles.final_provider_inventory_empty == true
          ' "$G4_FIXTURE_OUT" >/dev/null

          jq -e '
            . as $root |
            all(.runners[];
              .bootstrap_template.os_type == "linux" and
              .bootstrap_template.arch == "amd64" and
              .bootstrap_template.flavor == "truenas-linux-general" and
              .bootstrap_template.jit_config_enabled == true and
              .bootstrap_template.image == $root.runner.image and
              .bootstrap_template.pool_id == "g4-pool" and
              (.bootstrap_template.extra_specs.runner_install_template | type == "string" and length > 0) and
              .expected_compose_template.services.runner.image == $root.runner.image and
              .expected_compose_template.services.runner.user == "1001:1001" and
              .expected_compose_template.services.runner.restart == "no" and
              .expected_compose_template.services.runner.cap_drop == ["ALL"] and
              .expected_compose_template.services.runner.security_opt == ["no-new-privileges:true"] and
              .expected_compose_template.services.runner.cpus == 4 and
              .expected_compose_template.services.runner.mem_limit == 8589934592 and
              .expected_compose_template.services.runner.tmpfs == ["/run/garm-jit:rw,nosuid,nodev,noexec,uid=1001,gid=1001,mode=0700"] and
              .expected_compose_template.services.runner.labels["io.sempersupra.garm.controller-id"] == "g4-controller" and
              .expected_compose_template.services.runner.labels["io.sempersupra.garm.pool-id"] == "g4-pool" and
              .expected_compose_template.services.runner.labels["io.sempersupra.garm.execution-profile"] == "truenas-linux-general" and
              .expected_compose_template.services.runner.environment.GARM_RUNNER_SHA256 == $root.runner.tool_sha256
            )
          ' "$G4_FIXTURE_OUT" >/dev/null

          jq -e '
            .runners[0].bootstrap_template["instance-token"] != .runners[1].bootstrap_template["instance-token"] and
            .runners[0].bootstrap_template["callback-url"] != .runners[1].bootstrap_template["callback-url"] and
            .runners[0].bootstrap_template["metadata-url"] != .runners[1].bootstrap_template["metadata-url"] and
            .retirement_orders == [["alpha","beta"],["beta","alpha"]]
          ' "$G4_FIXTURE_OUT" >/dev/null

      - name: Upload exact G4 fixture bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: garm-provider-truenas-g4-fixture
          path: /tmp/g4/garm-provider-g4-fixture.json
          if-no-files-found: error
          retention-days: 7

      - name: Record export evidence
        if: always()
        shell: bash
        run: |
          {
            printf '%s\n' '### GARM provider nested G4 fixture export'
            printf '\n'
            printf -- '- provider source: `%s`\n' '${{ steps.source.outputs.ref }}'
            if [[ -f /tmp/g4/garm-provider-g4-fixture.json ]]; then
              printf -- '- schema: `%s`\n' "$(jq -r '.schema' /tmp/g4/garm-provider-g4-fixture.json)"
              printf -- '- alpha App: `%s`\n' "$(jq -r '.runners[0].expected_app_name' /tmp/g4/garm-provider-g4-fixture.json)"
              printf -- '- beta App: `%s`\n' "$(jq -r '.runners[1].expected_app_name' /tmp/g4/garm-provider-g4-fixture.json)"
              printf -- '- source oracles: `%s`\n' "$(jq -c '.source_oracles' /tmp/g4/garm-provider-g4-fixture.json)"
            else
              printf '%s\n' '- fixture bundle: not produced'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
