name: Public provider CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provider-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go contract and safety tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'Unformatted Go files:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Verify module metadata
        shell: bash
        run: |
          set -euo pipefail
          go mod download
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race ./...

      - name: Build provider executable
        run: go build ./cmd/garm-provider-truenas

      - name: Smoke pinned runner image contract
        shell: bash
        run: |
          set -euo pipefail
          image="$(sed -n 's/^[[:space:]]*RunnerImage[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' internal/provider/provider.go)"
          if [ -z "$image" ]; then
            echo 'Unable to resolve pinned RunnerImage from provider source.'
            exit 1
          fi
          docker pull "$image"
          docker run --rm \
            --user 1001:1001 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --tmpfs /home/runner/actions-runner:rw,nosuid,nodev,uid=1001,gid=1001,mode=0700 \
            --entrypoint /bin/bash \
            "$image" -c '
              set -euo pipefail
              test "$(id -u)" = 1001
              test -x /runnertmp/run.sh
              test -x /runnertmp/bin/Runner.Listener
              command -v curl >/dev/null
              command -v sed >/dev/null
              mkdir -p /home/runner/actions-runner
              cp -R /runnertmp/. /home/runner/actions-runner/
              test -x /home/runner/actions-runner/run.sh
              test -x /home/runner/actions-runner/bin/Runner.Listener
            '

      - name: Enforce public execution boundary
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE '^[[:space:]]*runs-on:[[:space:]].*(self-hosted|truenas-|ubuntu-noble-garm)' .github/workflows; then
            echo 'Public workflows must use GitHub-hosted runners only.'
            exit 1
          fi
          if grep -R -nE '^[[:space:]]*(TRUENAS_(API|TOKEN|KEY)|GARM_PROVIDER_CONFIG_FILE):' .github/workflows; then
            echo 'Public workflows must not embed private TrueNAS access.'
            exit 1
          fi
