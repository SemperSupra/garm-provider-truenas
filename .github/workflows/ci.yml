name: Public provider CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provider-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go contract and safety tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'Unformatted Go files:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race ./...

      - name: Build provider executable
        run: go build ./cmd/garm-provider-truenas

      - name: Enforce public execution boundary
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE 'runs-on:.*(self-hosted|truenas-|ubuntu-noble-garm)' .github/workflows; then
            echo 'Public workflows must use GitHub-hosted runners only.'
            exit 1
          fi
          if grep -R -nE 'GARM_PROVIDER_CONFIG_FILE.*(https?|wss?)://|TRUENAS_(API|TOKEN|KEY)' .github/workflows; then
            echo 'Public workflows must not embed private TrueNAS access.'
            exit 1
          fi
