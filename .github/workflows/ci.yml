name: Public provider CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provider-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go contract and safety tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'Unformatted Go files:\n%s\n' "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi

      - name: Verify module metadata
        shell: bash
        run: |
          set -euo pipefail
          go mod download
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race ./...

      - name: Build provider executable
        run: go build ./cmd/garm-provider-truenas

      - name: Smoke pinned image and verified runner payload
        shell: bash
        run: |
          set -euo pipefail
          source_file=internal/provider/provider.go
          image="$(sed -n 's/^[[:space:]]*RunnerImage[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "$source_file")"
          version="$(sed -n 's/^[[:space:]]*RunnerVersion[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "$source_file")"
          checksum="$(sed -n 's/^[[:space:]]*RunnerToolSHA256[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "$source_file")"
          if [ -z "$image" ] || [ -z "$version" ] || [ -z "$checksum" ]; then
            echo 'Unable to resolve pinned runner contract from provider source.'
            exit 1
          fi
          filename="actions-runner-linux-x64-${version}.tar.gz"
          url="https://github.com/actions/runner/releases/download/v${version}/${filename}"

          docker pull "$image"
          docker run --rm \
            --user 1001:1001 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --tmpfs /run/garm-jit:rw,nosuid,nodev,noexec,uid=1001,gid=1001,mode=0700 \
            --env GARM_TEST_RUNNER_URL="$url" \
            --env GARM_TEST_RUNNER_SHA256="$checksum" \
            --entrypoint /bin/sh \
            "$image" -c '
              set -eu
              test "$(id -u)" = 1001
              command -v curl >/dev/null
              command -v sed >/dev/null
              command -v tar >/dev/null
              command -v sha256sum >/dev/null

              test -w /home/runner
              test -w /run/garm-jit
              mount | grep " /run/garm-jit " | grep -q noexec
              printf "#!/bin/sh\nexit 0\n" > /run/garm-jit/noexec-probe
              chmod 700 /run/garm-jit/noexec-probe
              if /run/garm-jit/noexec-probe 2>/dev/null; then
                echo "Credential tmpfs unexpectedly allows direct execution."
                exit 1
              fi

              archive=/home/runner/stage4-runner.tar.gz
              rm -rf /home/runner/actions-runner "$archive"
              curl --fail --silent --show-error --location \
                --connect-timeout 5 --max-time 180 \
                "$GARM_TEST_RUNNER_URL" -o "$archive"
              printf "%s  %s\n" "$GARM_TEST_RUNNER_SHA256" "$archive" | sha256sum -c -
              mkdir -p /home/runner/actions-runner
              tar xzf "$archive" -C /home/runner/actions-runner
              rm -f "$archive"

              test -x /home/runner/actions-runner/run.sh
              test -x /home/runner/actions-runner/bin/Runner.Listener
              test -x /home/runner/actions-runner/externals/node24/bin/node
              /home/runner/actions-runner/externals/node24/bin/node --version
            '

      - name: Enforce public execution boundary
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE '^[[:space:]]*runs-on:[[:space:]].*(self-hosted|truenas-|ubuntu-noble-garm)' .github/workflows; then
            echo 'Public workflows must use GitHub-hosted runners only.'
            exit 1
          fi
          if grep -R -nE '^[[:space:]]*(TRUENAS_(API|TOKEN|KEY)|GARM_PROVIDER_CONFIG_FILE):' .github/workflows; then
            echo 'Public workflows must not embed private TrueNAS access.'
            exit 1
          fi
