name: Diagnose Stage 2 gofmt

on:
  push:
    branches:
      - feat/stage2-truenas-jsonrpc

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Show gofmt diff
        shell: bash
        run: |
          set -euo pipefail
          go version
          gofmt -d internal/truenasstore/store.go || true
